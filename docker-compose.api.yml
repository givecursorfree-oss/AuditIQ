# API-only stack for Vercel frontend + VPS backend (8 GB OK)
# Usage:
#   cp .env.api.example .env.api
#   docker compose -f docker-compose.api.yml --env-file .env.api up -d --build
#
# Exposes nginx on 80/443 → Node server. No React client container.
# DOMAIN=api.mkdandeker.com  CLIENT_URL=https://auditiq.mkdandeker.com (Vercel)

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: auditiq
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    command:
      - --innodb-buffer-pool-size=1G
      # 50 concurrent app users + Prisma pool (~25) + admin/migrations headroom
      - --max-connections=150
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

  typesense:
    image: typesense/typesense:29.0
    restart: unless-stopped
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY must be set}
      TYPESENSE_ENABLE_CORS: "true"
    volumes:
      - typesense_data:/data
    # reset-peers-on-error: Docker gives Typesense a new IP on every recreate; raft state otherwise crash-loops
    command: >-
      --data-dir /data
      --api-key=${TYPESENSE_API_KEY}
      --enable-cors
      --reset-peers-on-error
    deploy:
      resources:
        limits:
          memory: 2G

  tika:
    image: apache/tika:3.3.0.0-full
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      typesense:
        condition: service_started
      tika:
        condition: service_started
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/auditiq
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      NODE_ENV: production
      PORT: 3001
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL must be set}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-}
      LOG_LEVEL: info
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:?VAULT_ENCRYPTION_KEY must be set}
      SEMANTIC_SEARCH_ENABLED: ${SEMANTIC_SEARCH_ENABLED:-true}
      TYPESENSE_HOST: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY must be set}
      TIKA_URL: http://tika:9998
      ALLOW_STAFF_REGISTRATION: ${ALLOW_STAFF_REGISTRATION:-false}
      SKIP_EMAIL_VERIFICATION: ${SKIP_EMAIL_VERIFICATION:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-AuditIQ <no-reply@auditiq.local>}"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    volumes:
      - server_logs:/app/logs
      - document_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1280M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set e.g. api.mkdandeker.com}
      # Empty filter matches ALL env names in awk and can corrupt $host-style nginx vars.
      # Only substitute ${DOMAIN}.
      NGINX_ENVSUBST_FILTER: "^DOMAIN$$"
    volumes:
      - ./ops/nginx-api.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    # nginx image runs envsubst on /etc/nginx/templates/*.template → conf.d/
    deploy:
      resources:
        limits:
          memory: 128M

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    profiles:
      - ssl

volumes:
  mysql_data:
  typesense_data:
  server_logs:
  document_uploads:
  certbot_conf:
  certbot_www:
