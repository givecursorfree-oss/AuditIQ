# OPTIONAL — only if you do NOT use XAMPP MySQL.
# If XAMPP MySQL is running on port 3306, do NOT run npm run db:up (port conflict).
# Your app already uses: DATABASE_URL="mysql://root@localhost:3306/auditiq"
# Usage: npm run db:up
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: auditiq
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  mysql_dev_data:
