name: Deploy

# Manual only — does NOT auto-deploy to the VPS on push.
# Run from GitHub → Actions → Deploy → "Run workflow" when you are ready.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: ./client
            image-suffix: client
          - context: ./server
            image-suffix: server
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image-suffix }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to VPS (8 GB / kvm2)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      # SSH deploy — configure these secrets in your repo settings:
      #   DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY
      # VPS must have /opt/auditiq with docker-compose.kvm2.yml + .env.kvm2
      - name: Deploy via SSH (kvm2 — no Typesense/Tika)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd /opt/auditiq
            git pull --ff-only origin main
            docker compose -f docker-compose.kvm2.yml --env-file .env.kvm2 pull || true
            docker compose -f docker-compose.kvm2.yml --env-file .env.kvm2 up -d --build --remove-orphans
            docker compose -f docker-compose.kvm2.yml --env-file .env.kvm2 exec -T server npx prisma migrate deploy
            docker image prune -f
