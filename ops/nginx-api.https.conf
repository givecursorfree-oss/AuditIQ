# Drop-in HTTPS server for API host — after certbot:
#   cp ops/nginx-api.https.conf ops/nginx-api.conf
#   docker compose -f docker-compose.api.yml --env-file .env.api up -d --force-recreate nginx
# Requires DOMAIN env and certs at /etc/letsencrypt/live/${DOMAIN}/

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream auditiq_api {
    server server:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name ${DOMAIN};
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/plain text/css application/xml;

    location / {
        proxy_pass http://auditiq_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 86400;
    }
}
