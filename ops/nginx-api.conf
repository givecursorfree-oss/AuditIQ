# API reverse proxy (HTTP). After certbot, switch to ops/nginx-api.https.conf.
# Official nginx image envsubst only replaces ${ENV} from the container environment.
# Keep single $ for nginx vars ($host, $http_upgrade, …). Keep ${DOMAIN} for envsubst.
# IMPORTANT: this file must use LF line endings only (no CRLF).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream auditiq_api {
    server server:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name ${DOMAIN} _;
    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/plain text/css application/xml;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://auditiq_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 86400;
    }
}
